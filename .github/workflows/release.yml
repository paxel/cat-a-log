# The one Android/store pipeline. A release-branch push builds ONLY the
# signed Play bundle for internal testing; a tag (or the manual dispatch
# button) additionally runs the gate and everything below. One workflow
# means one run counter, so version codes from internal and release
# builds can never collide (#39).
#
#   gate           — full Linux gate, tags only (analyze fatal-infos, all tests,
#                    the Rust desktop's tests, tag = pubspec = Cargo versions,
#                    no known vulnerability in a lockfile, a CHANGELOG section
#                    for the version, no open high or critical code-scanning
#                    alert, Dart format, no untranslated string,
#                    the SonarQube Cloud quality gate OK)
#   geiger         — cargo geiger, report-only: unsafe counts in the log,
#                    never blocks
#   build-android  — signed per-ABI + universal APKs, refused when signed
#                    with the debug key
#   build-linux    — Rust desktop: tar.gz, .deb and AppImage per arch
#   build-windows  — Rust desktop: zip with catlog.exe
#   build-macos    — Rust desktop: unsigned catlog.app in a .dmg, per arch
#   render-channels — Homebrew cask + formula and Scoop manifest rendered from
#                    the artifacts, uploaded as an artifact on every run
#   ios            — the iPhone app built unsigned and its XCTest target run
#                    on a simulator (ios.yml); a gate for TestFlight
#   testflight     — signed iPhone build, uploaded to TestFlight when
#                    publishing
#   release        — GitHub Release, notes = the CHANGELOG section for the tag
#                    and signed build provenance for every file
#   channels       — the rendered files pushed to the tap and the bucket, after
#                    the Release, when publishing
#
# Publishing (Play, TestFlight, F-Droid, the Release, the tap and the bucket) happens
# on a tag, or on a manual dispatch that says publish=true. A dispatch
# without it is the dry run: every artifact is built and uploaded, nothing
# leaves GitHub.
#
# One-time setup (repository secrets):
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — upload keystore
#   CHANNEL_PAT — PAT with push access to paxel/homebrew-tap and
#                 paxel/scoop-bucket (shared with dedup-rs)
name: Release

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  # Releasing from the Actions UI: Run workflow → type the tag. `gh release
  # create` makes the tag at HEAD when it doesn't exist yet, so the button
  # alone can cut a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      publish:
        description: "Publish (release, Play, F-Droid, tap, bucket); off = dry run"
        type: boolean
        default: false

# Read-only by default; a job that writes widens it itself.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Every publishing step asks this; the artifacts are built regardless.
  PUBLISH: ${{ github.ref_type == 'tag' || github.event.inputs.publish == 'true' }}

jobs:
  gate:
    name: Gate (Linux, full)
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      # The full history, so the code-scanning step finds the branches
      # that hold the tagged commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Install sqlite3 for pure-Dart core tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Tag, pubspec version and Cargo version agree
        run: |
          ver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          cargo_ver=$(grep -m1 '^version = ' desktop/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != pubspec version $ver" >&2; exit 1; }
          [ "$cargo_ver" = "$tag" ] || { echo "tag v$tag != Cargo version $cargo_ver" >&2; exit 1; }
      # The Release's notes are this section (the release job below), which
      # would otherwise fall back to a bare "Release <version>." line
      # (cat-1006).
      - name: CHANGELOG.md has a section for this version
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab && NF { print }
          ' CHANGELOG.md | grep -q . || { echo "no ## [$ver] section with entries in CHANGELOG.md" >&2; exit 1; }
      # CodeQL analyses branches, not tags (cat-1007): every open alert on a
      # branch that holds this commit is listed, and one of severity high
      # or critical (security severity, or rule severity error) stops the
      # release. A branch CodeQL never analysed is skipped; none analysed
      # at all stops it too. CodeQL's alerts only: OpenSSF Scorecard's
      # (cat-1021) grade the repository's settings, not the code.
      - name: No open high or critical code-scanning alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          branches=$(git branch -r --contains "$sha" --format='%(refname:lstrip=3)' | grep -vx HEAD || true)
          analysed=0
          blocking=0
          for b in $branches; do
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/heads/$b&state=open&tool_name=CodeQL&per_page=100" \
              --jq '.[] | [(.rule.security_severity_level // "-"), .rule.severity, .rule.id, .most_recent_instance.location.path, .html_url] | @tsv' \
              > "$RUNNER_TEMP/alerts.tsv" 2> "$RUNNER_TEMP/error.txt"; then
              if grep -q 'no analysis found' "$RUNNER_TEMP/error.txt"; then
                echo "$b: not analysed by CodeQL, skipped"
                continue
              fi
              cat "$RUNNER_TEMP/error.txt" >&2
              exit 1
            fi
            analysed=$((analysed + 1))
            echo "Open code-scanning alerts on $b (security severity, severity, rule, file, link):"
            cat "$RUNNER_TEMP/alerts.tsv"
            n=$(awk -F'\t' '$1 == "high" || $1 == "critical" || $2 == "error"' "$RUNNER_TEMP/alerts.tsv" | wc -l)
            echo "$n of them high or critical"
            blocking=$((blocking + n))
          done
          [ "$analysed" -gt 0 ] || { echo "no CodeQL analysis on any branch that holds $sha" >&2; exit 1; }
          [ "$blocking" -eq 0 ] || { echo "$blocking open high or critical code-scanning alerts" >&2; exit 1; }
      # SonarQube Cloud's quality gate (cat-1018). The free plan analyses
      # summer only (sonar.yml), so this is summer's latest analysis:
      # release from summer after its SonarQube Cloud run has finished.
      - name: SonarQube Cloud quality gate
        run: |
          status=$(curl -fsS "https://sonarcloud.io/api/qualitygates/project_status?projectKey=paxel_cat-a-log" \
            | jq -r .projectStatus.status)
          echo "quality gate: $status"
          [ "$status" = "OK" ] || { echo "SonarQube Cloud quality gate is $status, not OK" >&2; exit 1; }
      # No known vulnerability in a lockfile (cat-1004), as on every push;
      # unmaintained notices are reported only, tool/osv_gate.py decides.
      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json
      # The app, the Dart core and the tools, formatted as `dart format`
      # writes them (cat-1008).
      - name: Dart format
        run: dart format --output=none --set-exit-if-changed .
      - name: Core — analyze and test
        working-directory: packages/catalog_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      # flutter pub get runs gen-l10n, which lists every message missing
      # in a locale in build/untranslated.json (l10n.yaml); any of them
      # fails the build (cat-1009).
      - name: No untranslated strings
        run: test "$(tr -d '[:space:]' < build/untranslated.json)" = "{}"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Desktop build dependencies
        run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Desktop — format, lint and test
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # Report-only (cat-1011): the unsafe counts of the desktop and its
  # dependencies, for the log. cargo geiger is known to abort on some
  # workspaces, so the job and its run may fail without failing the
  # release, and nothing needs it. The real rule is clippy's `unsafe_code`
  # workspace lint.
  geiger:
    name: Unsafe code report (cargo geiger, report-only)
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: System libraries (ALSA for the sounds)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - run: cargo install cargo-geiger --locked --version 0.14.0
      # geiger wants a package, not the virtual workspace root; the GUI
      # crate pulls in the other two.
      - name: Desktop
        continue-on-error: true
        run: cargo geiger --manifest-path "$GITHUB_WORKSPACE/desktop/crates/catlog-gui/Cargo.toml"

  # Runs on every branch push AND every tag — the gate blocks the
  # release-only jobs, not the internal-testing bundle.
  build-android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Write signing config from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=catlog
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
      - run: flutter pub get
      # $GITHUB_RUN_NUMBER of THIS workflow is the only version-code
      # source. The +100 floors it above the codes burned while two
      # workflows still had counters of their own (#39).
      - name: Build the Play app bundle
        run: flutter build appbundle --release --build-number=$((GITHUB_RUN_NUMBER + 100))
      - name: Upload internal-testing bundle
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: catlog-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Build release APKs
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          flutter build apk --release --split-per-abi --build-number=$((GITHUB_RUN_NUMBER + 100))
          flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100))
      # Gradle already refuses a release build without key.properties;
      # this checks what actually came out, before anything is uploaded
      # (cat-1010). An APK signed with the debug key would lock F-Droid
      # clients to it for good, and Play refuses the bundle.
      - name: Refuse anything signed with the debug key
        run: |
          shopt -s nullglob
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*release.apk; do
            "$apksigner" verify --print-certs "$apk" > certs.txt
            if grep -q "CN=Android Debug" certs.txt; then
              echo "$apk is signed with the debug key" >&2
              exit 1
            fi
          done
          aab=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$aab" > certs.txt
          grep -q "Owner:" certs.txt || { echo "$aab is not signed" >&2; exit 1; }
          if grep -q "CN=Android Debug" certs.txt; then
            echo "$aab is signed with the debug key" >&2
            exit 1
          fi
      - name: Rename artifacts
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          v="${RELEASE_TAG#v}"
          d=build/app/outputs/flutter-apk
          mkdir -p dist
          mv "$d/app-arm64-v8a-release.apk"   "dist/catlog-$v-android-arm64-v8a.apk"
          mv "$d/app-armeabi-v7a-release.apk" "dist/catlog-$v-android-armeabi-v7a.apk"
          mv "$d/app-x86_64-release.apk"      "dist/catlog-$v-android-x86_64.apk"
          mv "$d/app-release.apk"             "dist/catlog-$v-android-universal.apk"
          mv build/app/outputs/bundle/release/app-release.aab "dist/catlog-$v-android-playstore.aab"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: android
          path: dist/*
      # The tag ships Android too, the way it ships Homebrew and Scoop.
      # `status: completed` is the whole point: `draft` parks the release
      # in the Console and waits for a human to press Start rollout.
      - name: Publish to Google Play
        if: env.PUBLISH == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.paxel.catlog
          # Glob, not the tag: the file is named without the leading "v"
          # and a `with:` value cannot strip it.
          releaseFiles: dist/*-android-playstore.aab
          # Internal testing only. Promoting to closed testing is a
          # decision, taken in the Console after the build was tried.
          track: internal
          status: completed

  build-linux:
    name: Linux desktop (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config curl
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin catlog
      - name: Pack tar.gz, .deb and AppImage
        run: |
          v="${RELEASE_TAG#v}"
          desktop/packaging/linux/pack.sh "$v" "${{ matrix.arch }}" desktop/target/release/catlog dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Windows desktop
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin catlog
      - name: Pack
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart("v")
          desktop\packaging\windows\pack.ps1 -Version $v -Binary desktop\target\release\catlog.exe -Dist dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS desktop (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # Last Intel image GitHub offers; when it retires, switch the
          # x86_64 artifact to a cross-compile from the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin catlog
      - name: App bundle into dmg (unsigned)
        run: |
          v="${RELEASE_TAG#v}"
          desktop/packaging/macos/pack.sh "$v" "${{ matrix.arch }}" desktop/target/release/catlog dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  fdroid:
    name: F-Droid repo
    needs: [gate, build-android]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # The listing (texts, F-Droid fields, store graphics, screenshots)
      # and the changelog.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: app
      # Channel-repo pattern like Homebrew/Scoop: the index and APK live
      # in paxel/fdroid (own Pages), not in this repo's history.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android
          path: apks
      - name: Install fdroidserver
        run: pip install --quiet fdroidserver
      - name: Publish to the channel repo
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          v="${RELEASE_TAG#v}"
          git config --global user.name "catlog-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/fdroid.git" channel
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fdroid.p12"
          cd channel
          mkdir -p repo
          # F-Droid gets the 64-bit APK only: Flutter numbers split APKs
          # ABI x 1000 + build, which F-Droid's archiving would sort wrongly.
          # 32-bit APKs from before this go.
          rm -f repo/catlog-*-armeabi-v7a.apk archive/catlog-*-armeabi-v7a.apk
          # The main repository keeps the newest version and F-Droid moves
          # the one before into the archive, which keeps three: make room.
          mkdir -p archive
          ls archive/catlog-*-android-arm64-v8a.apk 2>/dev/null | sort -V | head -n -2 | xargs -r rm -f
          cp "$GITHUB_WORKSPACE/apks/catlog-$v-android-arm64-v8a.apk" repo/
          # The store listing travels with the app: only cat(a)log's files
          # are replaced, the other app's stay untouched.
          id=io.github.paxel.catlog
          app="$GITHUB_WORKSPACE/app"
          mkdir -p metadata
          cp "$app/fdroid/metadata.yml" "metadata/$id.yml"
          rm -rf "metadata/$id" "repo/$id"
          mkdir -p "metadata/$id"
          cp -r "$app/fastlane/metadata/android/." "metadata/$id/"
          en="metadata/$id/en-US"
          mkdir -p "$en/images/phoneScreenshots" "$en/changelogs"
          cp "$app/assets/icon/store/play-icon-512.png" "$en/images/icon.png"
          cp "$app/assets/icon/store/play-feature-1024x500.png" "$en/images/featureGraphic.png"
          cp "$app"/docs/screenshots/play/play-*.png "$en/images/phoneScreenshots/"
          # What's new: this version's CHANGELOG entries, cut to F-Droid's limit.
          python3 "$app/tool/whats_new.py" "$v" "$app/CHANGELOG.md" > "$en/changelogs/default.txt"
          # Must stay word for word the same as chaos-alert's release
          # workflow, or each release renames the repository.
          cat > config.yml <<EOF
          repo_url: https://paxel.github.io/fdroid/repo
          repo_name: paxel's apps
          repo_description: Releases of paxel's Android apps.
          repo_keyalias: repokey
          keystore: $RUNNER_TEMP/fdroid.p12
          keystorepass: $KEYSTORE_PASS
          keypass: $KEYSTORE_PASS
          archive_older: 1
          archive_name: paxel's apps (archive)
          archive_description: Older versions of paxel's Android apps.
          EOF
          # fdroidserver links each icon and feature graphic to a copy named
          # after its hash. Git keeps no hard links, so on the next run the
          # copies look stale and get deleted while the index still points
          # at them. Removing every app's copies first makes fdroidserver
          # create them all again.
          find repo -path 'repo/*/*' -regextype posix-extended \
            -regex '.*/(icon|featureGraphic|promoGraphic|tvBanner)_[A-Za-z0-9_=-]+\.(png|jpe?g)' -delete
          fdroid update --create-metadata
          rm config.yml
          git add -A
          git commit -m "catlog $v"
          git push

  release:
    name: GitHub Release
    needs: [gate, build-android, build-linux, build-windows, build-macos]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    # contents: the release itself. id-token and attestations: the signed
    # build provenance (Sigstore certificate from the workflow's OIDC token).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      # SLSA build provenance for every release file (cat-1022), signed with
      # Sigstore and stored with GitHub's attestations
      # (`gh attestation verify <file> --repo paxel/cat-a-log`). The bundle
      # is also a release asset, for verification without GitHub's API.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Add the provenance bundle to the release assets
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/catlog-${RELEASE_TAG}.intoto.jsonl"
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "cat(a)log $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "cat(a)log $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  render-channels:
    name: Render cask, formula and manifest
    needs: [gate, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Render from the templates with the artifacts' checksums
        run: desktop/packaging/render-channels.sh "${RELEASE_TAG#v}" dist out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: channels
          path: out/*

  # The iPhone app built unsigned and its XCTest target run on a simulator
  # (ios.yml, the same job as on every push to a branch); a gate: the
  # TestFlight upload needs it (cat-1020).
  ios:
    name: iOS
    needs: gate
    uses: ./.github/workflows/ios.yml
    permissions:
      contents: read

  # Signed iOS build (ADR-0003: no local Mac), uploaded to TestFlight when
  # publishing; a dry run builds and signs only. Behind the gate and the
  # iOS tests, like every other channel.
  #
  # Requires these repository secrets (see docs/ci-ios-signing.md):
  #   IOS_CERTIFICATE_BASE64   distribution certificate (.p12, base64)
  #   IOS_CERTIFICATE_PASSWORD password of that .p12
  #   IOS_PROFILE_BASE64       App Store provisioning profile (base64)
  #   APPSTORE_ISSUER_ID       App Store Connect API issuer id
  #   APPSTORE_KEY_ID          App Store Connect API key id
  #   APPSTORE_PRIVATE_KEY     App Store Connect API private key (.p8 contents)
  testflight:
    name: iOS to TestFlight
    needs: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/catlog.mobileprovision
      - run: flutter pub get
      - name: Pin manual signing for the archive build
        run: |
          for f in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            cat >> "$f" <<'EOF'
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 5Q2A853F9A
          PROVISIONING_PROFILE_SPECIFIER = catlog appstore
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF
          done
      # This workflow's run counter, as for the Android version codes:
      # one counter for every store build (#39). It stands well above the
      # numbers the separate TestFlight workflow used.
      - name: Build signed IPA
        run: flutter build ipa --release --build-number=$((GITHUB_RUN_NUMBER + 100)) --export-options-plist=ios/ExportOptions.plist
      - name: Upload to TestFlight
        if: env.PUBLISH == 'true'
        uses: apple-actions/upload-testflight-build@9fd28d4e690396e43caca69cef54cccccce77034 # v3.0.1
        with:
          app-path: build/ios/ipa/catlog.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

  # Only after the Release exists: the cask and the manifest point at its
  # assets, so nothing may be pushed before they are there.
  channels:
    name: Homebrew tap + Scoop bucket
    needs: [release, render-channels]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: channels
          path: out
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "catlog-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Casks tap/Formula
          cp out/catlog-cask.rb tap/Casks/catlog.rb
          cp out/catlog-formula.rb tap/Formula/catlog.rb
          git -C tap add Casks/catlog.rb Formula/catlog.rb
          git -C tap commit -m "catlog $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/catlog.json bucket/bucket/catlog.json
          git -C bucket add bucket/catlog.json
          git -C bucket commit -m "catlog $ver"
          git -C bucket push
