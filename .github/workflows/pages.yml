name: Pages

# Builds the documentation site (site/ -> site-dist/) on every push to summer,
# every pull request and every release tag; deploys it to GitHub Pages only for
# release tags, so the site always describes the app the stores have (#160).
# The frames are rendered here, on the runner, never committed (#161, #162):
# the phone's pages by the Flutter frame generator, the desk's by the kittest
# harness over the same demo catalog, both from the checked-out tree.
# Every build assembles every released minor version (the latest patch of
# each tag that carries a site, under /vX.Y.Z/) plus the working tree at the
# root, so a release whose docs no longer build fails on summer, not on
# release day.
#
# One-time steps in the repository settings, done on 2026-10-20:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      tags matching "v*" (the deploy job runs only on those).

on:
  push:
    branches: [summer]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every release tag that carries a site is built, see tool/site/build-all.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: System dependencies (sqlite3 and pdftoppm for the phone frames, software Vulkan for the desk's)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev poppler-utils mesa-vulkan-drivers libvulkan1 pkg-config libasound2-dev

      - name: Fonts the phone generator draws with
        run: flutter precache

      - name: Render the frames, phone and desk, English and German
        env:
          FRAMES_JOBS: 4
        run: |
          flutter pub get
          tool/frames.sh

      - name: Build site, every released minor version and the working tree
        run: node tool/site/build-all.js --base "/${{ github.event.repository.name }}/"

      - name: Test site build
        run: node --test "tool/site/*.test.js"

      - name: Check that the tag matches the pubspec.yaml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml | head -n 1)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version ($expected); the site would describe the wrong release"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
