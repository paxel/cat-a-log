name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Analyze & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install sqlite3 for pure-Dart core tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Core — analyze and test
        working-directory: packages/catalog_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Core — the fixture corpus the desktop core is tested against is current
        working-directory: packages/catalog_core
        run: |
          dart run tool/gen_fixtures.dart ../../desktop/fixtures
          git diff --exit-code -- ../../desktop/fixtures
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Tools — test
        run: python3 -m unittest discover -s tool -p 'test_*.py'

  desktop:
    name: Desktop (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System dependencies (software Vulkan for the render tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 pkg-config libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Render tests (headless wgpu)
        run: cargo test -p catlog-gui --test render --locked -- --ignored
      - name: Snapshot tests (the look of the six views and a card)
        run: cargo test -p catlog-gui --test snapshots --locked -- --ignored
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage per crate, 80% floor
        run: tool/coverage.sh
      - name: Reverse corpus — the desktop writes, the Dart core reads
        run: cargo run -p catlog-core --example reverse_corpus --locked -- target/reverse
      - uses: dart-lang/setup-dart@v1
      - name: Install sqlite3 for the Dart core
        run: sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Dart core reads what the desktop wrote
        working-directory: packages/catalog_core
        env:
          CATLOG_REVERSE_DIR: ../../desktop/target/reverse
        run: |
          dart pub get
          dart test test/reverse_corpus_test.dart

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write signing config from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=catlog
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100))
      - uses: actions/upload-artifact@v6
        with:
          name: catlog-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-build:
    name: iOS build (unsigned)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
