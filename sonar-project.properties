# SonarQube Cloud (cat-1017): https://sonarcloud.io/summary/new_code?id=paxel_cat-a-log
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis must be off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_cat-a-log
sonar.projectName=cat-a-log

# Dart (phone app and core), Rust (desktop) and Kotlin (Android).
# sonar.sources takes no wildcards, so each crate is listed.
sonar.sources=lib,\
  packages/catalog_core/lib,\
  desktop/crates/catlog-core/src,\
  desktop/crates/catlog-gui/src,\
  desktop/crates/catlog-l10n/src,\
  android/app/src/main
sonar.tests=test,\
  packages/catalog_core/test,\
  desktop/crates/catlog-core/tests,\
  desktop/crates/catlog-gui/tests

# Generated code and build output. GeneratedPluginRegistrant.java is written
# by `flutter pub get`; analysing Java would need compiled classes.
sonar.exclusions=lib/l10n/app_localizations*.dart,\
  desktop/fixtures/**,\
  build/**,\
  desktop/target/**,\
  **/GeneratedPluginRegistrant.java
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.cargo.manifestPaths=desktop/Cargo.toml
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage (cat-1016): tool/coverage.sh writes these LCOV files, generated
# code already left out. The core's paths start at the repository root
# (packages/catalog_core/lib/...), the app's at lib/, the Rust ones are
# absolute.
sonar.dart.lcov.reportPaths=coverage/lcov.info,packages/catalog_core/coverage/lcov.info
sonar.rust.lcov.reportPaths=desktop/coverage/lcov.info
