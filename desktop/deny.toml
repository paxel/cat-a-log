# cargo deny (cat-1022), run by CI and the release gate: RustSec advisories for
# the desktop's dependencies, their licences and their sources. A
# vulnerability, an unmaintained or unsound crate and a yanked version all fail
# the check. An exception is an entry in `ignore` below, with its reason; the
# same notices are accepted in osv-scanner.toml.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Unsound crates anywhere in the tree, not only the direct dependencies.
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, no fixed version; glyph widths in the PDF export and through lopdf and ab_glyph (winit, egui)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via eframe's Linux accessibility bus (accesskit_unix on zbus 5); leaves with an egui update" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via eframe's Linux accessibility bus (accesskit_unix on zbus 5); leaves with an egui update" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via eframe's Linux accessibility bus (accesskit_unix on zbus 5); leaves with an egui update" },
]

[licenses]
# The licences the dependency tree uses today: permissive ones, and MPL-2.0,
# whose copyleft stays with its own files. A new licence fails the check until
# it is looked at and added here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
