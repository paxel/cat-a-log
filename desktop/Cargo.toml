[workspace]
resolver = "2"
members = ["crates/catlog-core", "crates/catlog-l10n", "crates/catlog-gui"]

[workspace.package]
version = "2.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paxel/cat-a-log"

[profile.release]
strip = true
lto = "thin"

# No unsafe and no panics (cat-1012, cat-1013, cat-1014). `unsafe_code` is
# `deny`, not `forbid`: a `forbid` cannot be lifted by the module-level
# `expect` an FFI module would need. Tests may unwrap, expect, panic and
# index (clippy.toml; the files in tests/ allow them at the top). Each
# crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
