# Advisories the Security workflow accepts for this lockfile. Only "unmaintained"
# notices without a fixed version belong here; a vulnerability gets fixed instead.
# Every ignore has a reason and an ignoreUntil date (cat-1005): when it expires,
# the scan fails again and the notice is looked at anew.

